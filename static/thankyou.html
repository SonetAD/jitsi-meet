<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Thank You</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont,
          'SF Pro Display', 'Segoe UI', sans-serif;
        background-color: #0d0d0d;
        color: #eaeaea;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .container {
        text-align: center;
        padding: 20px;
        max-width: 800px;
      }

      .heading {
        font-size: 48px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.8;
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
        animation-delay: 0.2s;
      }

      .subtext {
        font-size: 18px;
        font-weight: 400;
        margin-top: 12px;
        line-height: 1.8;
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
        animation-delay: 0.5s;
      }

      .signature {
        font-size: 16px;
        font-weight: 400;
        margin-top: 40px;
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
        animation-delay: 0.8s;
      }

      .signature span {
        opacity: 0.6;
      }

      .cta {
        font-size: 16px;
        font-weight: 400;
        margin-top: 60px;
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
        animation-delay: 1.1s;
      }

      .cta a {
        color: #8e8e93;
        text-decoration: none;
        transition: all 0.3s ease;
        cursor: pointer;
        display: inline-block;
        position: relative;
      }

      .cta a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 1px;
        bottom: -2px;
        left: 0;
        background-color: #8e8e93;
        transition: width 0.3s ease;
      }

      .cta a:hover::after {
        width: 100%;
      }

      .cta a:hover {
        color: #eaeaea;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .heading {
          font-size: 36px;
          letter-spacing: 0.06em;
        }

        .subtext {
          font-size: 16px;
          margin-top: 10px;
        }

        .signature {
          font-size: 14px;
          margin-top: 32px;
        }

        .cta {
          font-size: 14px;
          margin-top: 48px;
        }
      }

      @media (max-width: 480px) {
        .heading {
          font-size: 28px;
          letter-spacing: 0.05em;
        }

        .subtext {
          font-size: 15px;
        }

        .signature {
          font-size: 13px;
          margin-top: 28px;
        }

        .cta {
          font-size: 13px;
          margin-top: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Thank You</h1>
      <p class="subtext">I'm really glad we connected today.</p>
      <p class="signature"><span>— Sonet</span></p>
      <div class="cta">
        <a
          href="https://sonetcraft.com/"
          target="_blank"
          rel="noopener noreferrer"
          >Visit SonetCraft →</a
        >
      </div>
    </div>
  </body>
</html>
